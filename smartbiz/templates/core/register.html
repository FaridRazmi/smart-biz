<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Store Account — SmartBiz</title>
    
    {% load static %}
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/smartbiz.css' %}">

    <style>
        body {
            background-color: var(--sb-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--sb-surface);
            border: 1px solid var(--sb-border);
            border-radius: var(--sb-radius-lg);
            box-shadow: var(--sb-shadow-sm);
            padding: 2rem;
        }

        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.625rem;
            margin-bottom: 1.75rem;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="{% url 'landing' %}" class="auth-brand">
            <div class="sb-brand-mark">SB</div>
            <span class="sb-brand-title">SmartBiz</span>
        </a>

        <div class="text-center mb-4">
            <h1 class="h4 mb-1">Create your store account</h1>
            <p class="text-muted small mb-0">Start recording daily sales and inventory in seconds</p>
        </div>

        {% if error %}
        <div class="sb-alert sb-alert-danger mb-3 p-2 small" role="alert">
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="sb-form-group">
                <label for="username" class="sb-label">Shop / Username</label>
                <input type="text" name="username" id="username" class="sb-input" required autofocus placeholder="e.g. nairobibiz" value="{{ username|default:'' }}">
                <div class="sb-input-hint">Your unique store identifier</div>
            </div>

            <div class="sb-form-group">
                <label for="email" class="sb-label">Email Address</label>
                <input type="email" name="email" id="email" class="sb-input" placeholder="e.g. store@example.com" value="{{ email|default:'' }}">
            </div>

            <div class="sb-form-group">
                <label for="password1" class="sb-label">Create Password</label>
                <input type="password" name="password1" id="password1" class="sb-input" required placeholder="At least 6 characters">
            </div>

            <div class="sb-form-group">
                <label for="password2" class="sb-label">Confirm Password</label>
                <input type="password" name="password2" id="password2" class="sb-input" required placeholder="Repeat password">
            </div>

            <button type="submit" class="sb-btn sb-btn-primary w-100 mt-2 mb-3">
                Create Account & Open Ledger
            </button>
        </form>

        <div class="text-center text-muted small">
            Already have a store account?
            <a href="{% url 'login' %}" class="text-dark fw-semibold text-decoration-none">Sign in here</a>
        </div>
    </div>

</body>
</html>
