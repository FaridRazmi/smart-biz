<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SmartBiz Platform Admin{% endblock %}</title>

    {% load static %}
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 for Grid & Utilities -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- SmartBiz Anti-Slop Custom Design System -->
    <link rel="stylesheet" href="{% static 'css/smartbiz.css' %}">
</head>
<body>

    <div class="sb-shell">
        <!-- Desktop Sidebar -->
        <aside class="sb-sidebar">
            <a href="{% url 'admin_dashboard' %}" class="sb-sidebar-brand">
                <div class="sb-brand-mark" style="background: #0284c7;">AD</div>
                <span class="sb-brand-title">SmartBiz</span>
                <span class="sb-brand-badge" style="background: #e0f2fe; color: #0369a1;">ADMIN</span>
            </a>

            <div class="sb-sidebar-nav">
                <span class="sb-nav-section-label">Platform Control</span>
                <a href="{% url 'admin_dashboard' %}" class="sb-nav-link {% if 'admin-dashboard' in request.path %}active{% endif %}">
                    <span class="sb-nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                    </span>
                    <span>Admin Overview</span>
                </a>
                <a href="{% url 'admin_users' %}" class="sb-nav-link {% if 'admin-users' in request.path %}active{% endif %}">
                    <span class="sb-nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </span>
                    <span>Merchant Accounts</span>
                </a>

                <span class="sb-nav-section-label" style="margin-top: 1.5rem;">Quick Switch</span>
                <a href="{% url 'dashboard' %}" class="sb-nav-link">
                    <span class="sb-nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
                    </span>
                    <span>Back to Shop View</span>
                </a>
            </div>

            <div class="sb-sidebar-footer">
                <div class="sb-user-info">
                    <div class="sb-user-name">{{ user.username }}</div>
                    <div class="sb-user-role">Superuser / Staff</div>
                </div>
                <form method="POST" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="sb-btn sb-btn-secondary sb-btn-sm" title="Log out" aria-label="Log out">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="sb-main">
            <header class="sb-topbar">
                <div class="sb-topbar-left">
                    <span class="badge bg-secondary-subtle text-secondary border px-2 py-1">Platform Admin Console</span>
                </div>
                <div class="sb-topbar-right">
                    <a href="{% url 'dashboard' %}" class="sb-btn sb-btn-secondary sb-btn-sm">Switch to Store</a>
                </div>
            </header>

            <div class="sb-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
